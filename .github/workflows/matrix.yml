name: Matrix demo
on: push
jobs: #matrix runs ALL combinations/configurations. so ubuntu with node 12, 14, 16 AND windows with node 12, 14, 16
  build: #matrix means u can run the same job with different configurations, eg: on different runners/node versions/any other values you wanna change at the SAME TIME.
    continue-on-error: true
    strategy:
      matrix:
        node-version: [12, 14, 16]
        operating-system: [ubuntu-latest, windows-latest]
        include: #allows u to include key-values without adding a bunch of new combinations. below is just 1 combination added instead of 2 
                 #(only for ubuntu not for windows if you were to add the 18 to the node-versions on line 8.)
                 #can also add NEW keys not above directly under the matrix tag.
          - node-version: 18
          - operating-system: ubuntu latest
        exclude:
          - node-version: 12
          - operating-system: windows-latest
    runs-on: ${{ matrix.operating-system }}
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci
      - name: Build project
        run: npm run build
